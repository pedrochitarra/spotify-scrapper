<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07140e">
  <title>Spotify Showcase</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="home.json" as="fetch" crossorigin>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <header class="top">
      <div class="top-in">
        <a class="brand" href="#/"><span>♫</span><b>Spotify</b>&nbsp;Showcase</a>
        <nav>
          <a v-for="n in nav" :key="n.page" :href="link(n.page)"
             :class="{active: route.page === n.page}">{{ n.label }}</a>
          <a class="full" href="streamlit/" title="Full Streamlit app (slower to load)">Streamlit ↗</a>
        </nav>
      </div>
    </header>
    <main>
      <div v-if="snapshots.length > 1 && route.page !== 'compare'" class="pills snap">
        <a v-for="s in snapshots" :key="s" :href="link(route.page, {...route.params, snap: s})"
           :class="{active: snap === s}">{{ label(s) }}</a>
      </div>
      <component :is="view" :key="route.key"></component>
    </main>
    <p class="foot">Educational project, not affiliated with Spotify. Data: Spotify Web API,
      kworb.net, Last.fm. Names come straight from Spotify and may contain explicit words.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
